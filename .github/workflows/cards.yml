name: Refresh project cards

on:
  schedule:
    - cron: "17 4 * * *"   # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/cards.py"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cards.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh project cards"
          file_pattern: "assets/card-*.svg"
