<svg xmlns="http://www.w3.org/2000/svg" width="440" height="126" viewBox="0 0 440 126" role="img" aria-labelledby="t d">
<title id="t">Archived project: all-pip-installer</title><desc id="d">Dry-run-first installer for curated Python package profiles.</desc>
<defs>
<style>
@font-face{font-family:'KD Mono';font-weight:500;src:url(data:font/woff;base64,) format('woff');}
@font-face{font-family:'KD Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff');}
