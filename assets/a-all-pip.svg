.display{font-family:'KD Display',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600;}
.sans{font-family:'KD Sans',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;}
